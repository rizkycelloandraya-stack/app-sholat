name: sholat_sigma
description: "Sholat Sigma - Class Prayer Tracker and 3-Photo Activity Documentation App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Prayer times calculation (Astronomical/Adhan)
  adhan: ^2.0.0

  # Location & Geocoding
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Camera & Image Capture
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Image processing & collage generation
  image: ^4.3.0

  # Local Notifications & Timezone
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Native Sharing
  share_plus: ^10.1.3

  # Local Storage
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # State Management & Helpers
  provider: ^6.1.2
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
